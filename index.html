<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE AI SHIFT — 2035</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0e; --bg2:#101216; --panel:rgba(13,14,18,.72);
  --ink:#e7e4dc; --ink2:#a8a49b; --mut:#5c5f68;
  --line:#22252c; --line2:#2e323b;
  --acc:#e2a44e; --accdim:#8a6531; --ok:#7fb37a; --warn:#c4574e;
  --disp:'Space Grotesk',sans-serif; --mono:'IBM Plex Mono',monospace;
  --sbw:242px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--disp);overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--acc);color:#0a0b0e}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:1px solid var(--acc);outline-offset:3px}
svg{display:block}

#gl{position:fixed;inset:0;z-index:0}
#labels{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#vig{position:fixed;inset:0;z-index:56;pointer-events:none;box-shadow:inset 0 0 26vh rgba(0,0,0,.52)}
#grain{position:fixed;inset:0;z-index:57;pointer-events:none;opacity:.045}
#wipe{position:fixed;top:0;bottom:0;left:0;width:26vw;z-index:40;pointer-events:none;opacity:0;
  border-right:1px solid rgba(226,164,78,.8);
  background:linear-gradient(90deg,transparent,rgba(226,164,78,.07))}
#wipe.go{animation:wp .8s cubic-bezier(.75,0,.2,1) forwards}
@keyframes wp{0%{transform:translateX(-30vw);opacity:0}12%{opacity:1}100%{transform:translateX(150vw);opacity:0}}

header{position:fixed;top:0;left:0;right:0;height:60px;z-index:22;display:flex;align-items:center;
  justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(10,11,14,.85),rgba(10,11,14,0));}
.brand{display:flex;align-items:baseline;gap:14px}
.brand b{font-weight:700;letter-spacing:.28em;font-size:13px}
.brand span{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.18em}
.hright{display:flex;align-items:center;gap:18px}
#stat{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--mut);display:flex;align-items:center;gap:8px}
#stat i{width:6px;height:6px;border-radius:50%;background:var(--acc);display:inline-block}
#stat.on{color:var(--ink2)} #stat.on i{background:var(--ok);animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hbtn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--mut);
  border:1px solid transparent;transition:.2s}
.hbtn:hover{color:var(--ink);border-color:var(--line2)}
#menuBtn{display:none}

nav{position:fixed;top:60px;bottom:56px;left:0;width:var(--sbw);z-index:21;border-right:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(10px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
  transition:transform .4s cubic-bezier(.7,0,.2,1)}
nav::-webkit-scrollbar{width:3px} nav::-webkit-scrollbar-thumb{background:var(--line2)}
.nitem{display:grid;grid-template-columns:36px 1fr;align-items:center;width:100%;text-align:left;
  padding:10px 20px 10px 24px;position:relative;transition:.22s;border-left:2px solid transparent}
.nitem .nn{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.1em;transition:.22s}
.nitem .nt{font-size:12px;letter-spacing:.14em;color:var(--ink2);font-weight:500;transition:.22s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem:hover{background:rgba(255,255,255,.025)}
.nitem:hover .nn{color:var(--acc)} .nitem:hover .nt{color:var(--ink);transform:translateX(3px)}
.nitem.act{border-left-color:var(--acc);background:rgba(226,164,78,.05)}
.nitem.act .nn{color:var(--acc)} .nitem.act .nt{color:var(--ink)}
#scrim{position:fixed;inset:0;z-index:20;background:rgba(5,6,8,.6);opacity:0;pointer-events:none;transition:.3s}

#stage{position:fixed;top:60px;bottom:56px;left:var(--sbw);right:0;z-index:10;display:flex;align-items:center;
  pointer-events:none;overflow:hidden}
.cz{max-width:640px;padding:0 24px 0 clamp(2rem,6vw,5.5rem);pointer-events:auto;transition:opacity .32s,transform .32s}
.cz.out{opacity:0;transform:translateY(-14px)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0)*90ms)}
.cz.in .rv{opacity:1;transform:none}
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:var(--acc);margin-bottom:18px}
h1.tt{font-size:clamp(2rem,4.4vw,3.5rem);font-weight:600;line-height:1.02;letter-spacing:-.015em}
.sub{font-size:clamp(15px,1.5vw,19px);color:var(--ink2);margin-top:12px;font-weight:400;max-width:520px;line-height:1.45}
.rule{height:1px;background:var(--line);margin:26px 0;position:relative;max-width:520px}
.rule::before{content:'';position:absolute;left:0;top:0;width:44px;height:1px;background:var(--acc)}
.body{font-size:14.5px;line-height:1.65;color:var(--ink2);max-width:520px;margin-bottom:8px}
.body b{color:var(--ink);font-weight:500}
.lst{list-style:none;margin-top:4px;max-width:560px}
.li{display:grid;grid-template-columns:34px 178px 1fr;gap:8px;align-items:baseline;padding:9px 10px 9px 0;
  border-bottom:1px solid var(--line);transition:background .2s;cursor:default}
.li:hover{background:rgba(255,255,255,.025)}
.li-n{font-family:var(--mono);font-size:10px;color:var(--mut);transition:.2s}
.li:hover .li-n{color:var(--acc)}
.li-t{font-size:12.5px;letter-spacing:.16em;font-weight:500;color:var(--ink)}
.li-d{font-size:12.5px;color:var(--mut);line-height:1.4}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:6px 0 10px}
.fs{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mut);padding-bottom:6px;
  border-bottom:1px solid var(--line);white-space:nowrap;
  animation:flowp var(--fdur) linear infinite;animation-delay:calc(var(--fd)/var(--fn)*var(--fdur))}
@keyframes flowp{0%,10%{color:var(--ink);border-color:var(--acc)}26%,100%{color:var(--mut);border-color:var(--line)}}
.fa{color:var(--mut)}
.note{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--mut);margin-top:22px}
.note em{color:var(--acc);font-style:normal}
.cta{margin-top:26px;font-family:var(--mono);font-size:11px;letter-spacing:.26em;color:var(--ink);
  border:1px solid var(--line2);padding:14px 26px;display:inline-flex;align-items:center;gap:12px;transition:.25s}
.cta:hover{border-color:var(--acc);color:var(--acc);background:rgba(226,164,78,.06)}
.bigonly .tt{font-size:clamp(2.4rem,5.4vw,4.4rem)}

footer{position:fixed;bottom:0;left:0;right:0;height:56px;z-index:22;display:flex;align-items:center;
  justify-content:space-between;padding:0 26px;border-top:1px solid var(--line);
  background:linear-gradient(0deg,rgba(10,11,14,.88),rgba(10,11,14,0))}
.fleft{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--mut)}
.fmid{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px}
.pgb{width:150px;height:1px;background:var(--line);position:relative}
.pgb i{position:absolute;left:0;top:0;height:1px;background:var(--acc);transition:width .5s cubic-bezier(.7,0,.2,1)}
.pgnum{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.1em}
.pgnum b{color:var(--ink);font-weight:500}
.fright{display:flex;align-items:center;gap:8px}
.fhint{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--mut);margin-right:14px}
.cbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--mut);
  border:1px solid var(--line);transition:.2s}
.cbtn:hover{color:var(--acc);border-color:var(--accdim)}
.cdiv{width:1px;height:18px;background:var(--line);margin:0 6px}

#hud{position:fixed;right:28px;bottom:78px;z-index:15;font-family:var(--mono);font-size:10px;letter-spacing:.2em;
  color:var(--ink2);display:flex;align-items:center;gap:9px;opacity:0;transform:translateY(8px);
  transition:.35s;pointer-events:none;text-align:right}
#hud.on{opacity:1;transform:none}
#hud .dot{width:5px;height:5px;border-radius:50%;background:var(--ok)}
#hud .dot.warn{background:var(--warn)} #hud .dot.acc{background:var(--acc)}
.al{position:absolute;top:0;left:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--ink2);
  white-space:nowrap;opacity:0;transition:opacity .4s;padding-bottom:10px;text-align:center}
.al::after{content:'';position:absolute;bottom:0;left:50%;width:3px;height:3px;border-radius:50%;background:var(--acc)}
.al.acc{color:var(--acc)} .al.warn{color:var(--warn)} .al.dim{color:var(--mut)}
.al small{display:block;font-size:8.5px;color:var(--mut);letter-spacing:.14em;margin-top:3px}
.al.hot{color:var(--ink)}

#map{position:fixed;inset:0;z-index:50;background:rgba(7,8,10,.9);backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transition:opacity .45s}
#map.on{opacity:1;pointer-events:auto}
.mhead{position:absolute;top:26px;left:0;right:0;text-align:center}
.mhead b{font-family:var(--mono);font-size:11px;letter-spacing:.4em;color:var(--ink)}
.mhead span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--mut);margin-top:8px}
#msvg{position:absolute;inset:60px 0 40px;width:100%;height:calc(100% - 100px)}
.mn{cursor:pointer}
.mn circle.c{fill:#14161b;stroke:var(--line2);stroke-width:1;transition:.25s}
.mn circle.r{fill:none;stroke:transparent;stroke-width:1;transition:.25s}
.mn text{fill:var(--mut);font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-anchor:middle;transition:.25s;pointer-events:none}
.mn:hover circle.c,.mn.sel circle.c{stroke:var(--acc);fill:#1c1710}
.mn:hover circle.r{stroke:rgba(226,164,78,.35)}
.mn:hover text{fill:var(--ink)}
.mn .num{fill:var(--acc);font-size:8px}
.mline{stroke:#20242c;stroke-width:1;transition:stroke .25s}
.mline.hot{stroke:rgba(226,164,78,.55)}
.mhub circle{fill:none;stroke:var(--acc);stroke-width:1}
.mhub text{fill:var(--ink);font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-anchor:middle}
#mclose{position:absolute;top:22px;right:26px}

#boot{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;
  transition:opacity .8s;font-family:var(--mono)}
#boot.off{opacity:0;pointer-events:none}
.bw{width:min(440px,84vw)}
.bh{font-size:11px;letter-spacing:.3em;color:var(--ink);margin-bottom:26px}
.bh span{color:var(--mut)}
#blines{font-size:10.5px;letter-spacing:.14em;color:var(--mut);line-height:2.1;min-height:150px}
#blines .ok{color:var(--ok)} #blines .em{color:var(--acc)} #blines .flt{color:var(--warn)}
.cur{display:inline-block;width:7px;height:12px;background:var(--acc);vertical-align:-2px;animation:blink 1s infinite}

@media (max-width:980px){
  nav{transform:translateX(-102%)} nav.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  #scrim.on{opacity:1;pointer-events:auto}
  #menuBtn{display:flex}
  #stage{left:0}
  .cz{padding:0 26px}
  .li{grid-template-columns:28px 1fr;grid-auto-rows:auto}
  .li-d{grid-column:2}
  .fhint,.fleft{display:none}
  .pgb{width:80px}
  #hud{right:16px;bottom:70px}
  header,footer{padding:0 16px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){
  .fs{animation:none} .rv{transition-duration:.01s}
}
</style>
</head>
<body>

<div id="gl"></div>
<div id="labels"></div>
<div id="wipe"></div>

<header>
  <div class="brand"><b>AI SHIFT</b><span>2035 SIMULATION</span></div>
  <div class="hright">
    <span id="stat"><i></i><span id="statT">BOOTING</span></span>

      <svg id="icSndOn" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" style="display:none"><path d="M2 6v4h3l4 3V3L5 6H2z"/><path d="M11.5 5.5a4 4 0 010 5"/></svg>

    </button>
  </div>
</header>

<main id="stage"><div class="cz" id="cz"></div></main>

  <div class="fleft">AI SHIFT / 2035</div>

    <span class="pgnum"><b id="pgN">01</b> / 20</span>
    <div class="pgb"><i id="pgF"></i></div>
  </div>
  <div class="fright">

    <button class="cbtn" id="prevB" aria-label="Previous slide"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 2L4 7l5 5"/></svg></button>
    <button class="cbtn" id="nextB" aria-label="Next slide"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 2l5 5-5 5"/></svg></button>

    <button class="cbtn" id="fsB" aria-label="Toggle fullscreen"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
  </div>

<div id="hud" aria-live="polite"></div>

  <button class="hbtn" id="mclose" aria-label="Close map"><svg width="15" height="15" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.3"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
  <svg id="msvg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<div id="grain"></div>
<div id="vig"></div>

<div id="boot"><div class="bw">
  <div class="bh">AI SHIFT — CORE <span>v3.5 / 2035</span></div>
  <div id="blines"></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
'use strict';
/* ============================ APP CORE ============================ */
const $=id=>document.getElementById(id);
const T=THREE, ACC=0xe2a44e, LITE=0xd9d5cb, WARN=0xc4574e, OKC=0x7fb37a;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LOW=matchMedia('(max-width:980px)').matches||(navigator.hardwareConcurrency||8)<=4;
const SPD=RM?.45:1;
const App={activity:1,mx:0,my:0,px:0,py:0};
const V1=new T.Vector3();
const rnd=(a,b)=>a+Math.random()*(b-a);
const pad2=n=>String(n).padStart(2,'0');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
function kf(t,keys){for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(t<=b[0])return a[1]+(b[1]-a[1])*smooth((t-a[0])/(b[0]-a[0]));}return keys[keys.length-1][1];}

/* GSAP fallback — applies values instantly so the app still works if the CDN is blocked */
const G=window.gsap||{
  _apply(tg,o){if(!tg||!o)return;['x','y','z','opacity','intensity','density','activity','t'].forEach(p=>{if(typeof o[p]==='number'&&tg[p]!==undefined)tg[p]=o[p];});},
  to(tg,o){this._apply(tg,o);if(o&&o.onUpdate)o.onUpdate();if(o&&o.onComplete)o.onComplete();return tg;},
  fromTo(tg,a,o){return this.to(tg,o);},
  timeline(o){const self=this;const t={add(f){if(typeof f==='function')f();return t;},
    to(a,b){self.to(a,b);return t;},fromTo(a,b,c){self.to(a,c);return t;},set(){return t;}};
    if(o&&o.onComplete)o.onComplete();return t;}
};

/* ---- optional sound (muted by default) ---- */
const SND={on:false,ctx:null,g:null,
  init(){if(this.ctx)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    this.ctx=new C();this.g=this.ctx.createGain();this.g.gain.value=.14;this.g.connect(this.ctx.destination);},
  blip(f,d,type,v){if(!this.on)return;this.init();if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(),e=this.ctx.createGain();o.type=type||'sine';o.frequency.value=f;
    e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(.3*(v||1),t+.012);e.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(e);e.connect(this.g);o.start(t);o.stop(t+d+.05);}};
 $('sndBtn').addEventListener('click',()=>{SND.on=!SND.on;
  $('icSndOn').style.display=SND.on?'block':'none';$('icSndOff').style.display=SND.on?'none':'block';
  if(SND.on){SND.blip(520,.08);setTimeout(()=>SND.blip(780,.1),90);}});

/* Fault readout — any error prints on the boot screen instead of a silent black screen */
let booting=true;
addEventListener('error',e=>{if(booting){const d=document.createElement('div');
  d.className='flt';d.textContent='FAULT: '+(e.message||'unknown');$('blines').appendChild(d);}});

/* ============================ DATA ============================ */
const SLIDES=[
{env:'shift',nav:'THE SHIFT',kicker:'01 / BOOT SEQUENCE',title:'THE AI SHIFT',sub:'How intelligent machines are changing the world.',
 body:'AI is moving from a software feature into <b>infrastructure</b>. It is already changing:'},
{env:'here',nav:'AI IS HERE',kicker:'02 / CAPABILITIES',title:'AI IS ALREADY HERE',
 body:'Four capabilities crossed the threshold from research demos to daily infrastructure. <b>Hover each line</b> — the corresponding system responds.',
 items:[['PERCEPTION','Machines interpret images, video and physical space in real time.','perception'],
        ['LANGUAGE','Models read, write, translate and converse at human fluency.','language'],
        ['PREDICTION','Patterns in data become forecasts before events occur.','prediction'],
        ['GENERATION','Text, images, code and sound are produced on demand.','generation']]},
{env:'robots',nav:'ROBOT WORKFORCE',kicker:'03 / PHYSICAL AUTOMATION',title:'THE ROBOT WORKFORCE',
 body:'Physical work is becoming increasingly automated — not as a future scenario, but as a current production reality.',
 items:[['MANUFACTURING','Lights-out cells run through the night without human presence.'],
        ['LOGISTICS','Routing, loading and fleet flow optimize continuously.'],
        ['WAREHOUSES','Picking and packing at machine cadence, around the clock.'],
        ['DANGEROUS ENVIRONMENTS','Deep, high, hot, toxic — machines go first.'],
        ['PRECISION WORK','Tolerances measured in microns, held for entire shifts.']]},
{env:'hybrid',nav:'HUMAN + AI',kicker:'04 / COLLABORATION MODEL',title:'HUMAN + AI',
 body:'The future may not simply be humans versus machines. It may be <b>humans working with machines</b> — judgment paired with scale.',
 items:[['HUMAN JUDGMENT','Context, ethics, taste, accountability.'],
        ['AI CAPABILITY','Speed, memory, pattern range, tireless iteration.'],
        ['COMBINED OUTPUT','Better decisions than either makes alone.']]},
{env:'office',nav:'BUSINESS',kicker:'05 / ENTERPRISE',title:'THE OFFICE IS BECOMING SOFTWARE',
 body:'The organization chart is quietly gaining non-human employees.',
 items:[['RESEARCH','Markets scanned and summarized in minutes.'],
        ['ANALYSIS','Every dataset interrogated, continuously.'],
        ['CUSTOMER SUPPORT','First-line resolution, instant, in any language.'],
        ['REPORTING','Documents that write themselves from live data.'],

function dotTex(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,30);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.4,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');

function polarFloor(){
  const g=new T.Group(),m=new T.LineBasicMaterial({color:0x1d212a,transparent:true,opacity:.5});
  for(let r=2;r<=22;r+=2){const pts=[];for(let i=0;i<=90;i++){const a=i/90*Math.PI*2;pts.push(new T.Vector3(Math.cos(a)*r,0,Math.sin(a)*r));}
    g.add(new T.Line(new T.BufferGeometry().setFromPoints(pts),m));}
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;
    g.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(Math.cos(a)*2,0,Math.sin(a)*2),new T.Vector3(Math.cos(a)*22,0,Math.sin(a)*22)]),m));}
  g.position.y=-3.6;return g;
}

function puff(n,box,o){

  const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(pos,3));
  const pm=new T.PointsMaterial({size:s,map:DOT,color:c,transparent:true,opacity:(o.o!==undefined)?o.o:.4,depthWrite:false,blending:T.AdditiveBlending,sizeAttenuation:true});
  const pts=new T.Points(geo,pm);

  return {g,update(dt,dir,k){if(!g.visible)return;k=k||1;dir=dir||1;
    for(const o2 of dots){o2.t=(o2.t+dt*sp*dir*k)%1;if(o2.t<0)o2.t+=1;curve.getPoint(o2.t,V1);o2.d.position.copy(V1);}}};
}

function mkMol(n,rr){
  const g=new T.Group(),nodes=[];
  const geoA=new T.SphereGeometry(.15,10,8),geoB=new T.SphereGeometry(.1,8,6);
  for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,rad=Math.sqrt(1-y*y),th=i*2.39996;
    const p=new T.Vector3(Math.cos(th)*rad*rr,y*rr,Math.sin(th)*rad*rr);
    const m=new T.Mesh(i%3===0?geoB:geoA,i%3===0?mat(ACC,.5,.4,.5):mat(LITE,0,.4,.4));
    m.position.copy(p);g.add(m);nodes.push(m);}
  const bm=new T.MeshBasicMaterial({color:0x565c66});
  for(let i=0;i<n;i++){const a=nodes[i].position,b=nodes[(i+1)%n].position;
    if(Math.random()<.25&&i<n-2)continue;
    const d=a.distanceTo(b),c=new T.Mesh(new T.CylinderGeometry(.028,.028,d,5),bm);
    c.position.copy(a).lerp(b,.5);c.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),b.clone().sub(a).normalize());g.add(c);}
  return {g,nodes};
}

/* ---- anchored HTML labels (accepts Vector3, Object3D or {x,y,z}) ---- */
function lb(E,obj,html,cls,dx,dy){
  const o=new T.Object3D();
  if(obj&&obj.isVector3)o.position.copy(obj);
  else if(obj&&obj.isObject3D)o.position.copy(obj.position);
  else if(obj)o.position.set(obj.x||0,obj.y||0,obj.z||0);
  E.group.add(o);
  const el=document.createElement('div');el.className='al '+(cls||'');el.innerHTML=html;
  $('labels').appendChild(el);
  const L={o,el,dx:dx||0,dy:dy||0,op:.92};E.labels.push(L);return L;
}

function updLabels(){

    E.agents.forEach((a,i)=>{a.core.rotation.y+=dt*(.6+i*.1)*k;a.core.rotation.x+=dt*.3*k;
      a.ring.rotation.x=Math.sin(t*.8+i)*.6;a.ring.rotation.y+=dt*.4*k;});
    E.cf.update(dt,1,k);
    E.tt+=dt*.11*k;
    const q=E.tt%1;E.orbit.getPoint(q,V1);E.task.position.copy(V1);
    E.task.rotation.y+=dt*3*k;
    const idx=Math.floor(q*6)%6;
    if(idx!==E.hi){E.hi=idx;const a=E.agents[idx];
      a.label.el.innerHTML=`${a.name}<small>${a.st}</small>`;
      G.fromTo(a.core.scale,{x:1,y:1,z:1},{x:1.35,y:1.35,z:1.35,duration:.3,yoyo:true,repeat:1});
      hud(`AGENT ${idx+1} — ${a.st}`,'acc');SND.blip(600+idx*60,.04,'sine',.4);}};
  E.enter=()=>{hud('GOAL RECEIVED — TEAM ASSEMBLED','acc');};
}};

/* ---- 19 THE HUMAN QUESTION ---- */
ENVDEFS.quiet={cam:[0,1.4,10.5],look:[0,1,0],
build(E){
  const g=E.group;
  const glow=new T.Mesh(new T.CircleGeometry(3,40),new T.MeshBasicMaterial({color:0x181410}));
  glow.position.set(2.6,.6,-6.5);g.add(glow);
  E.sil=new T.Group();E.sil.position.set(2.6,-3.6,-6);g.add(E.sil);
  const sm=new T.MeshStandardMaterial({color:0x0d0e11,roughness:1,metalness:0});
  const body=new T.Mesh(new T.CylinderGeometry(.42,.72,3.1,10),sm);body.position.y=1.85;E.sil.add(body);
  const head=new T.Mesh(new T.SphereGeometry(.4,12,10),sm);head.position.y=3.65;E.sil.add(head);
  const rim=new T.PointLight(0xcaa87a,.7,9);rim.position.set(4.5,3,-9);g.add(rim);
  E.part=puff(28,{x:6,y:5,z:4,cy:1},{c:0x8f95a3,s:.05,o:.18});g.add(E.part.pts);
  lb(E,new T.Vector3(2.6,4.6,-6),'HUMAN','dim');
  E.update=(dt,t)=>{E.part.update(dt,SPD*App.activity);
    E.sil.scale.y=1+Math.sin(t*.5)*.008;};
  E.enter=()=>{G.to(App,{activity:.07,duration:2.4});
    if(LKEY)G.to(LKEY,{intensity:.18,duration:2.4});
    if(LHEMI)G.to(LHEMI,{intensity:.4,duration:2.4});
    if(scene)G.to(scene.fog,{density:.045,duration:2.4});};
  E.exit=()=>{G.to(App,{activity:1,duration:1.2});
    if(LKEY)G.to(LKEY,{intensity:.7,duration:1.2});
    if(LHEMI)G.to(LHEMI,{intensity:.95,duration:1.2});
    if(scene)G.to(scene.fog,{density:.026,duration:1.2});};
}};

/* ---- 20 — 2035 ---- */
ENVDEFS.one={cam:[0,6.5,25.5],look:[0,0,0],
build(E){
  const g=E.group;E.minis=[];E.flows=[];
  const pedGeo=new T.CylinderGeometry(1.7,1.9,.22,14);
  const place=(a,build)=>{
    const M2=new T.Group();M2.position.set(Math.cos(a)*10,-2.6,Math.sin(a)*10);
    M2.lookAt(0,-2.6,0);M2.add(new T.Mesh(pedGeo,mat(0x14161a)));
    const inner=new T.Group();inner.position.y=.11;M2.add(inner);
    build(inner);g.add(M2);E.minis.push(inner);};
  const ang=i=>i/9*Math.PI*2+.35;
  place(ang(0),o=>{const b=new T.Mesh(new T.BoxGeometry(2,.14,.5),mat(0x191c21));o.add(b);
    const ar=mkArm(.55,true);ar.g.position.set(-.6,0,.4);o.add(ar.g);o.userData.u=(dt,t)=>idleWork(ar,t,.8);});
  place(ang(1),o=>{const r1=mkRack(.6);r1.g.position.set(-.5,0,0);o.add(r1.g);
    const r2=mkRack(.6);r2.g.position.set(.6,0,-.2);o.add(r2.g);o.userData.u=(dt,t)=>{r1.blink(t);r2.blink(t+2);};});
  place(ang(2),o=>{[-.7,0,.8].forEach((x,i)=>{const b=mkBuilding(.6,1+i*.4,.6,i%2?WINTEX:WINTEX2);b.position.x=x;o.add(b);});
    const c=new T.Mesh(new T.BoxGeometry(.3,.12,.2),mat(LITE));c.position.set(0,.06,.6);o.add(c);
    o.userData.u=(dt,t)=>{c.position.x=Math.sin(t*.6)*.9;};});
  place(ang(3),o=>{const d=mkDrone(.7);o.add(d.g);
    o.userData.u=(dt,t)=>{d.g.position.y=.9+Math.sin(t*2)*.1;d.g.rotation.y=t;d.spin(dt);};});
  place(ang(4),o=>{const m=mkMol(7,.85);o.add(m.g);
    o.userData.u=(dt,t)=>{m.g.rotation.y+=dt*.6;m.g.rotation.x+=dt*.2;};});
  place(ang(5),o=>{const d=mkDesk(.8);o.add(d.g);
    const orb=new T.Mesh(new T.SphereGeometry(.09,8,6),mat(ACC,.8,.35,.4));orb.position.y=1.6;o.add(orb);
    o.userData.u=(dt,t)=>{orb.position.y=1.5+Math.sin(t*2)*.12;};});
  place(ang(6),o=>{const gt=new T.Mesh(new T.TorusGeometry(.55,.06,8,24),mat(0x2c313a));gt.position.y=.9;gt.rotation.y=1.2;o.add(gt);
    const ar=mkArm(.45);ar.g.position.set(.7,0,.5);o.add(ar.g);
    o.userData.u=(dt,t)=>idleWork(ar,t+1,.7);});
  place(ang(7),o=>{for(let i=0;i<3;i++){const c=new T.Mesh(new T.OctahedronGeometry(.16,0),mat(i===1?ACC:LITE,.4,.4,.5));
      const aa=i/3*Math.PI*2;c.position.set(Math.cos(aa)*.6,1,Math.sin(aa)*.6);o.add(c);}
    o.userData.u=(dt,t)=>{o.children.forEach((c,i)=>c.rotation.y+=dt*(.6+i*.3));};});
  place(ang(8),o=>{const c=mkCar(.4);o.add(c.g);c.g.position.y=.1;c.g.rotation.y=-.6;
    o.userData.u=(dt,t)=>{c.wheels.forEach(w=>w.rotation.z+=dt*3);};});
  E.lines=[];
  const pos=E.minis.map((m,i)=>new T.Vector3(Math.cos(ang(i))*10,.3,Math.sin(ang(i))*10));
  for(let i=0;i<9;i++){const a=pos[i],b=pos[(i+1)%9],c2=pos[(i+3)%9];
    const lm=new T.LineBasicMaterial({color:ACC,transparent:true,opacity:0});
    g.add(new T.Line(new T.BufferGeometry().setFromPoints([a,b]),lm));E.lines.push(lm);
    const lm2=new T.LineBasicMaterial({color:0x2e323b,transparent:true,opacity:0});
    const cur=new T.QuadraticBezierCurve3(a,a.clone().lerp(c2,.5).add(new T.Vector3(0,2.5,0)),c2);
    g.add(new T.Line(new T.BufferGeometry().setFromPoints(cur.getPoints(30)),lm2));E.lines.push(lm2);
    if(i%3===0){const f=flow(cur,2,.2,ACC,.07,.8);g.add(f.g);E.flows.push(f);}}
  E.update=(dt,t)=>{const k=SPD;
    E.minis.forEach(m=>m.userData.u&&m.userData.u(dt*k,t));
    E.flows.forEach(f=>f.update(dt,1,k));
    E.group.rotation.y=Math.sin(t*.05)*.05;};
  E.enter=()=>{E.lines.forEach((l,i)=>G.to(l,{opacity:(i%2)?.5:.16,duration:1.2,delay:i*.05}));
    hud('ALL SYSTEMS — LINKED','acc');SND.blip(520,.1,'sine',.5);setTimeout(()=>SND.blip(780,.14,'sine',.5),140);};
}};

/* ============================ SCENE MANAGER ============================ */
function ensureEnv(name){
  if(ENVSx[name])return ENVSx[name];
  const def=ENVDEFS[name];
  const E={name,group:new T.Group(),cam:def.cam,look:def.look,labels:[],update:null,enter:def.enter,exit:def.exit};
  try{def.build(E);}catch(err){console.warn('Env build failed:',name,err);}
  E.group.visible=false;
  if(scene)scene.add(E.group);
  ENVSx[name]=E;return E;
}

/* ============================ NAVIGATION ============================ */
let cur=-1,busy=false,mapOpen=false;
const chev='<svg class="fa" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 1.5l4.5 4.5-4.5 4.5"/></svg>';

function renderContent(i){
  const s=SLIDES[i],cz=$('cz');
  let h=`<div class="rv kick" style="--d:0">${s.kicker}</div>
    <h1 class="rv tt" style="--d:1">${s.title}</h1>`;
  if(s.sub)h+=`<p class="rv sub" style="--d:2">${s.sub}</p>`;
  h+=`<div class="rv rule" style="--d:2"></div>`;
  if(s.body)h+=`<p class="rv body" style="--d:3">${s.body}</p>`;
  if(s.flow){const n=s.flow.length,dur=(n*.9).toFixed(1)+'s';
    h+=`<div class="flow rv" style="--d:3;--fn:${n};--fdur:${dur}">`+
      s.flow.map((f,k)=>`${k?chev:''}<span class="fs" style="--fd:${k}">${f}</span>`).join('')+`</div>`;}
  if(s.body2)h+=`<p class="rv body" style="--d:4">${s.body2}</p>`;
  if(s.items)h+=`<ul class="lst">`+s.items.map((it,k)=>
    `<li class="rv li" style="--d:${4+k}" ${it[2]?`data-k="${it[2]}"`:''}>
      <span class="li-n">${pad2(k+1)}</span><span class="li-t">${it[0]}</span><span class="li-d">${it[1]||''}</span></li>`).join('')+`</ul>`;
  if(s.note)h+=`<div class="rv note" style="--d:6">${s.note}</div>`;
  if(s.cta)h+=`<button class="rv cta" id="againBtn" style="--d:5">${s.cta} ${chev}</button>`;
  cz.className='cz'+(s.big?' bigonly':'');cz.innerHTML=h;
  const ab=$('againBtn');if(ab)ab.addEventListener('click',()=>{SND.blip(700,.06);go(0);});
  cz.querySelectorAll('[data-k]').forEach(el=>{
    el.addEventListener('mouseenter',()=>{if(activeE&&activeE.onFocus)activeE.onFocus(el.dataset.k);});});
  requestAnimationFrame(()=>requestAnimationFrame(()=>cz.classList.add('in')));
}
function wipe(){const w=$('wipe');if(RM)return;w.classList.remove('go');void w.offsetWidth;w.classList.add('go');}
function setActiveNav(n){
  document.querySelectorAll('.nitem').forEach((el,i)=>el.classList.toggle('act',i===n));
  $('pgN').textContent=pad2(n+1);
  $('pgF').style.width=((n+1)/20*100)+'%';
  const act=document.querySelector('.nitem.act');if(act)act.scrollIntoView({block:'nearest'});
}
function go(n){
  n=clamp(n,0,19);
  if(busy||n===cur)return;
  const first=cur<0;busy=true;
  SND.blip(first?520:640,.045,'triangle',.6);
  const s=SLIDES[n];
  const E=HAS3D?ensureEnv(s.env):null;
  const dir=first?1:(Math.sign(n-cur)||1);
  const old=activeE;activeE=E;
  setActiveNav(n);cur=n;
  hideAllLabels();
  const cz=$('cz');cz.classList.add('out');
  wipe();
  if(first||!HAS3D||!E){
    setTimeout(()=>{if(E&&E.group)E.group.visible=true;if(E&&E.enter)E.enter();
      renderContent(n);busy=false;},80);
    return;}
  G.timeline({onComplete(){busy=false;}})
   .to(camPos,{x:E.cam[0],y:E.cam[1],z:E.cam[2]+2.6,duration:.5,ease:'power2.in'},0)
   .to(camTgt,{x:E.look[0],y:E.look[1],z:E.look[2],duration:.5,ease:'power2.in'},0)
   .add(()=>{
      if(old){G.to(old.group.position,{x:10*dir,duration:.5,ease:'power2.in',onComplete(){
        old.group.visible=false;old.group.position.x=0;if(old.exit)old.exit();}});}
      E.group.position.x=-10*dir;E.group.visible=true;
      renderContent(n);
      G.to(E.group.position,{x:0,duration:1,ease:'power3.out'});
      if(E.enter)E.enter();
    },.48)
   .to(camPos,{x:E.cam[0],y:E.cam[1],z:E.cam[2],duration:1,ease:'power3.out'},.5);
}

/* ============================ CONTROLS ============================ */
SLIDES.forEach((s,i)=>{
  const b=document.createElement('button');b.className='nitem';
  b.innerHTML=`<span class="nn">${pad2(i+1)}</span><span class="nt">${s.nav}</span>`;
  b.addEventListener('click',()=>{closeNav();SND.blip(560+i*10,.04,'triangle',.5);go(i);});
  $('nav').appendChild(b);
});
function closeNav(){$('nav').classList.remove('open');$('scrim').classList.remove('on');}
 $('menuBtn').addEventListener('click',()=>{$('nav').classList.toggle('open');$('scrim').classList.toggle('on');});
 $('scrim').addEventListener('click',closeNav);
 $('prevB').addEventListener('click',()=>go(cur-1));
 $('nextB').addEventListener('click',()=>go(cur+1));
 $('fsB').addEventListener('click',toggleFS);
function toggleFS(){
  const d=document.documentElement;
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    if(d.requestFullscreen)d.requestFullscreen();else if(d.webkitRequestFullscreen)d.webkitRequestFullscreen();}
  else if(document.exitFullscreen)document.exitFullscreen();
  else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
}
addEventListener('keydown',e=>{
  if(booting){skipBoot();return;}
  if(mapOpen){if(e.key==='Escape')toggleMap(false);return;}
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  else if(e.key==='m'||e.key==='M')toggleMap();
  else if(e.key==='f'||e.key==='F')toggleFS();
  else if(e.key==='Home')go(0);else if(e.key==='End')go(19);
});
let tx=0,ty=0;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)&&!mapOpen&&!booting)go(cur+(dx<0?1:-1));},{passive:true});
addEventListener('mousemove',e=>{
  App.mx=(e.clientX/innerWidth-.5)*2;App.my=(e.clientY/innerHeight-.5)*2;});

/* ============================ ZOOM MAP ============================ */
const MPOS=[[500,108],[372,170],[176,244],[306,318],[192,412],[282,490],[404,578],[782,242],[920,336],[864,442],
  [838,562],[712,520],[604,458],[862,128],[92,338],[104,526],[568,586],[628,170],[452,404],[500,232]];
const MEDGES=[[0,1],[0,17],[0,19],[19,17],[19,1],[19,18],[18,15],[18,3],[3,17],[17,4],[17,5],[17,6],[5,6],
  [6,16],[16,11],[11,12],[12,19],[4,14],[14,13],[13,8],[8,1],[1,9],[9,8],[9,10],[10,19],[15,3],[2,4],[2,0]];
let mapBuilt=false;
function buildMap(){
  const svg=$('msvg');let h='';
  MEDGES.forEach(e=>{h+=`<line class="mline" data-a="${e[0]}" data-b="${e[1]}" x1="${MPOS[e[0]][0]}" y1="${MPOS[e[0]][1]}" x2="${MPOS[e[1]][0]}" y2="${MPOS[e[1]][1]}"/>`;});
  h+=`<g class="mhub"><circle cx="500" cy="318" r="16"/><circle cx="500" cy="318" r="26" opacity=".4"/><text x="500" y="322">AI SHIFT</text></g>`;
  SLIDES.forEach((s,i)=>{const x=MPOS[i][0],y=MPOS[i][1];
    h+=`<g class="mn" data-i="${i}"><circle class="r" cx="${x}" cy="${y}" r="13"/><circle class="c" cx="${x}" cy="${y}" r="5"/>
      <text class="num" y="${y-14}">${pad2(i+1)}</text><text y="${y+24}">${s.nav}</text></g>`;});
  svg.innerHTML=h;
  svg.querySelectorAll('.mn').forEach(n=>{
    n.addEventListener('click',()=>{toggleMap(false);go(+n.dataset.i);});
    n.addEventListener('mouseenter',()=>{const i=+n.dataset.i;
      svg.querySelectorAll('.mline').forEach(l=>{if(+l.dataset.a===i||+l.dataset.b===i)l.classList.add('hot');});});
    n.addEventListener('mouseleave',()=>svg.querySelectorAll('.mline').forEach(l=>l.classList.remove('hot')));});
  mapBuilt=true;
}
function toggleMap(force){
  mapOpen=(force===undefined)?!mapOpen:force;
  $('map').classList.toggle('on',mapOpen);
  if(mapOpen){if(!mapBuilt)buildMap();SND.blip(500,.07,'sine',.6);}
}
 $('mapB').addEventListener('click',()=>toggleMap());
 $('mclose').addEventListener('click',()=>toggleMap(false));

/* ============================ BOOT ============================ */
const BLINES=[
  ['> MOUNTING RENDER CORE','OK'],['> LINKING 20 ENVIRONMENTS','OK'],
  ['> CALIBRATING SENSOR ARRAY','OK'],['> SPOOLING DATA PATHS','OK'],
  ['<span class="em">SYSTEM ONLINE ●</span>','']];
let bTimer=null;
function bootStep(){
  if(!booting)return;
  if(bIdx>=BLINES.length){finishBoot();return;}
  const line=BLINES[bIdx++];
  const d=document.createElement('div');
  d.innerHTML=line[0]+(line[1]?` <span class="ok">··· ${line[1]}</span>`:'');
  $('blines').appendChild(d);
  SND.blip(440+bIdx*90,.04,'sine',.35);
  bTimer=setTimeout(bootStep,RM?120:340);
}
let bIdx=0;
function skipBoot(){clearTimeout(bTimer);finishBoot();}
function finishBoot(){
  if(!booting)return;booting=false;
  $('blines').innerHTML=BLINES.map(l=>`<div>${l[0]}${l[1]?' <span class="ok">··· OK</span>':''}</div>`).join('');
  setTimeout(()=>{
    $('boot').classList.add('off');
    $('stat').classList.add('on');$('statT').textContent='SYSTEM ONLINE';
    go(0);
    setTimeout(()=>{ // gentle staggered prebuild of the remaining environments
      let i=0;const keys=Object.keys(ENVDEFS);
      const iv=setInterval(()=>{if(i>=keys.length){clearInterval(iv);return;}
        if(HAS3D)ensureEnv(keys[i++]);},280);
    },1500);
  },RM?300:500);
}
function initBoot(){
  const l=document.createElement('div');
  l.innerHTML='AI SHIFT — BOOT SEQUENCE <span class="cur"></span>';
  $('blines').appendChild(l);
  bTimer=setTimeout(bootStep,500);
  $('boot').addEventListener('click',skipBoot);
}

/* ============================ MAIN LOOP ============================ */
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(dustUpdate)dustUpdate(dt,SPD*App.activity);
  App.px+=((RM?0:App.mx*.5)-App.px)*.03;
  App.py+=((RM?0:-App.my*.3)-App.py)*.03;
  camera.position.set(camPos.x+App.px,camPos.y+App.py,camPos.z);
  camera.lookAt(camTgt.x,camTgt.y,camTgt.z);
  if(activeE&&activeE.group.visible&&activeE.update)activeE.update(dt,t);
  updLabels();
  renderer.render(scene,camera);
}

/* grain texture */
(function(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const d=x.createImageData(128,128);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  x.putImageData(d,0,0);$('grain').style.background=`url(${c.toDataURL()})`;})();

/* start */
try{if(window.THREE){init3D();HAS3D=true;}}catch(e){console.warn('WebGL unavailable — running flat mode',e);HAS3D=false;}
if(HAS3D)ensureEnv('shift');
initBoot();
const clock=new THREE.Clock();
if(HAS3D)tick();
else{$('stat').classList.add('on');$('statT').textContent='SYSTEM ONLINE';}
</script>
